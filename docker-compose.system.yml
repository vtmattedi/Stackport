# Stackport system stack, installed and maintained by stackport.sh.
# Managed applications use separate Compose projects and join stackport-proxy.
name: stackport

networks:
  stackport-proxy:
    name: stackport-proxy

services:
  stackport:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stackport
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    networks: [default, stackport-proxy]
    volumes:
      # The app user receives Docker socket access through docker-entrypoint.sh.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${STACKPORT_DATA_DIR:-./data}:/app/data
      - ${STACKPORT_LOGS_DIR:-./logs}:/app/logs
      # Mount dotenv directly to preserve literal $ in secrets.
      - ./.env:/app/.env:ro
      - ${STACKPORT_NGINX_DIR:-./nginx-data}:/etc/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Compose reads this container path; HOST_PROJECT_ROOT resolves host mounts.
      - ./docker-compose.system.yml:/app/docker-compose.system.yml:ro

  nginx:
    image: nginx:1.27-alpine
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    container_name: stackport-nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    ports:
      - "80:80"
      - "443:443"
    networks: [default, stackport-proxy]
    volumes:
      - ${STACKPORT_NGINX_DIR:-./nginx-data}:/etc/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/stackport/certbot-webroot:/var/lib/stackport/certbot-webroot:ro
