name: CI

on:
  pull_request:
  # Pushes to main run this through promote.yml, which moves stable when it passes.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (typecheck, lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  client:
    name: Client (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      # Same layout as the Dockerfile: vite.config.ts resolves Node types from the
      # root install.
      - run: npm ci
      - run: npm ci --prefix client
      # build:dry skips the version bump, so CI never rewrites build-info.json.
      - run: npm --prefix client run build:dry

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n stackport.sh && bash -n docker-entrypoint.sh
      # ShellCheck ships on GitHub's Ubuntu runners.
      - run: shellcheck -S warning stackport.sh docker-entrypoint.sh

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag stackport:ci .
